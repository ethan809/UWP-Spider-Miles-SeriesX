name: Miles Morales preflight checks

on:
  push:
    paths:
      - 'tools/inspect_miles.py'
      - 'tools/pe_imports.py'
      - 'tools/runtime_gap.py'
      - 'tools/miles_boot_report.py'
      - 'tests/test_inspect_miles.py'
      - 'tests/test_pe_imports.py'
      - 'tests/test_runtime_gap.py'
      - 'tests/test_miles_boot_report.py'
      - 'tests/test_miles_steam_source.py'
      - 'source/SteamDownload.cs'
      - 'source/SteamTransfer/SteamSession.cs'
      - 'source/SteamTransfer/TransferCore.cs'
      - 'source/MainPage.xaml'
      - 'source/MainPage.xaml.cs'
      - 'source/GameVersionSupport.cs'
      - 'source/ImportEngine.cs'
      - 'source/FolderImportEngine.cs'
      - 'source/WifiFolderTransfer.cs'
      - 'source/WifiTransfer.html'
      - '.github/workflows/miles-research-checks.yml'
  pull_request:
    paths:
      - 'tools/inspect_miles.py'
      - 'tools/pe_imports.py'
      - 'tools/runtime_gap.py'
      - 'tools/miles_boot_report.py'
      - 'tests/test_inspect_miles.py'
      - 'tests/test_pe_imports.py'
      - 'tests/test_runtime_gap.py'
      - 'tests/test_miles_boot_report.py'
      - 'tests/test_miles_steam_source.py'
      - 'source/SteamDownload.cs'
      - 'source/SteamTransfer/SteamSession.cs'
      - 'source/SteamTransfer/TransferCore.cs'
      - 'source/MainPage.xaml'
      - 'source/MainPage.xaml.cs'
      - 'source/GameVersionSupport.cs'
      - 'source/ImportEngine.cs'
      - 'source/FolderImportEngine.cs'
      - 'source/WifiFolderTransfer.cs'
      - 'source/WifiTransfer.html'
      - '.github/workflows/miles-research-checks.yml'

jobs:
  inspect-tool-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python tools and static launcher source preflight
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
